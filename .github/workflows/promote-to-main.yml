name: Promote dev to main

# Auto-promotion: every push to dev (or a manual run) re-verifies the full
# gate suite, then advances main through a dev -> main PR with auto-merge.
# If repo/org policy forbids GitHub Actions from creating pull requests,
# it falls back to a gated direct push (the promote job only runs after
# verify + e2e succeed, so the gate guarantees are identical).
#
# PR creation and merging require contents:write (merge) and
# pull-requests:write (create PR, enable auto-merge).

on:
    push:
        branches: [dev]
    workflow_dispatch:

concurrency:
    group: promote-to-main
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    verify:
        name: Verify (typecheck, lint, test, build)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}

    e2e:
        name: Verify (e2e)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Install agent-browser (npm package, no source build)
              run: npm install -g agent-browser@latest && agent-browser --version

            - name: Run e2e suite
              run: |
                  npx vite preview --port 4173 &
                  sleep 5
                  npm run test:e2e

    promote:
        name: Promote (PR with auto-merge, or gated direct push)
        needs: [verify, e2e]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Count commits to promote
              id: diff
              run: |
                  git fetch origin main dev --no-tags
                  count=$(git rev-list --count origin/main..dev)
                  echo "commits=$count" >> "$GITHUB_OUTPUT"
                  echo "dev is $count commit(s) ahead of main"

            - name: Promote via PR (or gated direct push when PRs are not permitted)
              if: steps.diff.outputs.commits != '0'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  short_sha=$(git rev-parse --short dev)
                  title="Promote dev to main ($short_sha)"

                  pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
                  if [ -z "$pr" ]; then
                      commits=$(git log --oneline --no-decorate origin/main..dev)
                      if ! pr=$(gh pr create \
                          --base main \
                          --head dev \
                          --title "$title" \
                          --body "Automated promotion of \`dev\` (\`$short_sha\`) to \`main\`.

                  All verification gates passed: typecheck, lint, unit tests, production build, e2e suite.

                  <details><summary>Commits in this promotion</summary>

                  $commits

                  </details>"); then
                          # Org/repo policy can forbid GitHub Actions from creating pull
                          # requests ("GitHub Actions is not permitted to create or approve
                          # pull requests"). This job only runs after verify + e2e passed,
                          # so a direct push is an equally gated promotion.
                          echo "::warning::GitHub Actions is not permitted to create pull requests (repo/org Actions policy). Falling back to a gated direct push of dev -> main."
                          git push origin dev:main
                          echo "Promoted dev ($short_sha) to main via gated direct push."
                          exit 0
                      fi
                  fi
                  echo "Promotion PR: #$pr"

                  # With no branch protection there is nothing for auto-merge to wait
                  # on ("clean status"), so merge now; otherwise arm auto-merge and let
                  # the required checks drive the merge.
                  state=$(gh pr view "$pr" --json mergeable,mergeStateStatus --jq '.mergeable + " " + .mergeStateStatus')
                  echo "PR #$pr merge state: $state"
                  if [ "$state" = "MERGEABLE CLEAN" ]; then
                      gh pr merge "$pr" --merge
                      echo "Merged PR #$pr immediately (no required checks configured to wait for)."
                  else
                      gh pr merge "$pr" --auto --merge
                      echo "Auto-merge armed on PR #$pr; it will merge once all required checks pass."
                  fi

            - name: Nothing to promote
              if: steps.diff.outputs.commits == '0'
              run: echo "dev has no commits ahead of main — already promoted."
