name: Promote dev to main

# Auto-promotion: every push to dev (or a manual run) re-verifies the full
# gate suite, then opens or refreshes a dev -> main promotion PR with
# auto-merge enabled. main is only ever advanced through this gated PR.
#
# PR creation and merging require contents:write (merge) and
# pull-requests:write (create PR, enable auto-merge).

on:
    push:
        branches: [dev]
    workflow_dispatch:

concurrency:
    group: promote-to-main
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    verify:
        name: Verify (typecheck, lint, test, build)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}

    e2e:
        name: Verify (e2e)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Install agent-browser (npm package, no source build)
              run: npm install -g agent-browser@latest && agent-browser --version

            - name: Run e2e suite
              run: |
                  npx vite preview --port 4173 &
                  sleep 5
                  npm run test:e2e

    promote:
        name: Promote (open PR, enable auto-merge)
        needs: [verify, e2e]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Count commits to promote
              id: diff
              run: |
                  git fetch origin main dev --no-tags
                  count=$(git rev-list --count origin/main..dev)
                  echo "commits=$count" >> "$GITHUB_OUTPUT"
                  echo "dev is $count commit(s) ahead of main"

            - name: Open or reuse promotion PR
              id: pr
              if: steps.diff.outputs.commits != '0'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  short_sha=$(git rev-parse --short dev)
                  title="Promote dev to main ($short_sha)"

                  pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
                  if [ -z "$pr" ]; then
                      commits=$(git log --oneline --no-decorate origin/main..dev)
                      gh pr create \
                          --base main \
                          --head dev \
                          --title "$title" \
                          --body "Automated promotion of \`dev\` (\`$short_sha\`) to \`main\`.

                  All verification gates passed: typecheck, lint, unit tests, production build, e2e suite.

                  <details><summary>Commits in this promotion</summary>

                  $commits

                  </details>"
                      pr=$(gh pr view --json number --jq .number)
                  fi
                  echo "number=$pr" >> "$GITHUB_OUTPUT"
                  echo "Promotion PR: #$pr"

            - name: Enable auto-merge
              if: steps.diff.outputs.commits != '0'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh pr merge "${{ steps.pr.outputs.number }}" --auto --merge
                  echo "Auto-merge enabled on PR #${{ steps.pr.outputs.number }}; it will merge once all required checks pass."

            - name: Nothing to promote
              if: steps.diff.outputs.commits == '0'
              run: echo "dev has no commits ahead of main — already promoted."
