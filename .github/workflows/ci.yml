name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}

    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Install agent-browser (npm package, no source build)
              run: npm install -g agent-browser@latest && agent-browser --version

            - name: Run e2e suite
              run: |
                  npx vite preview --port 4173 &
                  sleep 5
                  npm run test:e2e

    security-audit:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: npm audit (high severity, non-blocking)
              run: npm audit --audit-level high || echo "::warning::npm audit found high-severity issues"

    # Single aggregate status check: make THIS job the required check on main
    # (and on dev) so the promotion gate and branch protection have one name
    # to key on, instead of tracking each job individually.
    verification-gate:
        needs: [build, e2e, security-audit]
        if: ${{ always() }}
        runs-on: ubuntu-latest

        steps:
            - name: Evaluate verification gate
              run: |
                  results="${{ join(needs.*.result, ' ') }}"
                  echo "Gate results: $results"
                  failed=0
                  for result in $results; do
                      if [[ "$result" != "success" && "$result" != "skipped" ]]; then
                          echo "::error::Verification gate failed: a required job reported '$result'"
                          failed=1
                      fi
                  done
                  exit $failed
