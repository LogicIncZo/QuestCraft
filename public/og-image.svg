<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B241E"/>
      <stop offset="100%" stop-color="#1E5244"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(243,238,226,0.06)" stroke-width="2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="rgba(217,161,59,0.16)"/>
      <stop offset="100%" stop-color="rgba(217,161,59,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- dice icon -->
  <g transform="translate(530,150)">
    <rect x="0" y="0" width="140" height="140" rx="26" fill="#F3EEE2"/>
    <circle cx="38" cy="38" r="12" fill="#164035"/>
    <circle cx="102" cy="38" r="12" fill="#164035"/>
    <circle cx="70" cy="70" r="12" fill="#164035"/>
    <circle cx="38" cy="102" r="12" fill="#164035"/>
    <circle cx="102" cy="102" r="12" fill="#164035"/>
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="#F3EEE2">QuestCraft</text>
  <text x="600" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="rgba(232,186,95,0.95)">AI-Powered Educational Board Game Engine</text>

  <text x="600" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="rgba(243,238,226,0.72)">Learn through play · Build quests · 4 languages</text>
</svg>
