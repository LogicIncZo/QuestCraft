<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- dice icon -->
  <g transform="translate(300,240)">
    <rect x="0" y="0" width="150" height="150" rx="28" fill="#ffffff"/>
    <circle cx="40" cy="40" r="13" fill="#4338ca"/>
    <circle cx="110" cy="40" r="13" fill="#4338ca"/>
    <circle cx="75" cy="75" r="13" fill="#4338ca"/>
    <circle cx="40" cy="110" r="13" fill="#4338ca"/>
    <circle cx="110" cy="110" r="13" fill="#4338ca"/>
  </g>

  <text x="500" y="355" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="#ffffff">QuestCraft</text>
  <text x="502" y="425" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" fill="#ddd6fe">AI-Powered Educational Board Game Engine</text>

  <text x="600" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="rgba(255,255,255,0.75)">Learn through play · Build quests · 4 languages</text>
</svg>
