        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QuestCraft - AI Powered Board Game Engine</title>
        <meta
            name="description"
            content="AI-powered educational board game engine. Turn any topic into a playable quest with Gemini, OpenAI, Groq, or OpenRouter. 8 built-in quests, 4 languages, classroom-ready."
        />
        <meta property="og:title" content="QuestCraft - AI Powered Board Game Engine" />
        <meta
            property="og:description"
            content="Turn any topic into a playable AI-driven board game. Build quests, learn through play."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://questcraft.vercel.app" />
        <meta property="og:image" content="/og-image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="QuestCraft - AI Powered Board Game Engine" />
        <meta
            name="twitter:description"
            content="Turn any topic into a playable AI-driven board game. Build quests, learn through play."
        />
        <meta name="twitter:image" content="/og-image.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Spline+Sans+Mono:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <script type="importmap">
            {
                "imports": {
                    "react": "https://esm.sh/react@^19.1.1",
                    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
                    "react/": "https://esm.sh/react@^19.1.1/",
                    "@google/genai": "https://esm.sh/@google/genai@^1.13.0",
                    "showdown": "https://esm.sh/showdown@2.1.0",
                    "vite": "https://esm.sh/vite@^7.1.2",
                    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.0.0",
                    "vite-plugin-static-copy": "https://esm.sh/vite-plugin-static-copy@^3.1.1",
                    "path": "https://esm.sh/path@^0.12.7",

    </head>
    <body class="bg-felt-900 text-paper font-sans antialiased">
        <style>
            /* The app shell is a fixed-height flex column; the window itself never scrolls. */
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            /* Visible keyboard focus everywhere, without changing mouse aesthetics. */
            :focus-visible {
                outline: 2px solid #d9a13b;
                outline-offset: 2px;
                border-radius: 4px;
            }
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                    scroll-behavior: auto !important;
                }
            }
        </style>
        <div id="root"></div>
        <script type="module" src="/index.tsx"></script>
    </body>
</html>
