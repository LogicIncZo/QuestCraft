<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QuestCraft - AI Powered Board Game Engine</title>
        <meta
            name="description"
            content="AI-powered educational board game engine. Turn any topic into a playable quest with Gemini, OpenAI, Groq, or OpenRouter. 8 built-in quests, 4 languages, classroom-ready."
        />
        <meta property="og:title" content="QuestCraft - AI Powered Board Game Engine" />
        <meta
            property="og:description"
            content="Turn any topic into a playable AI-driven board game. Build quests, learn through play."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://questcraft.vercel.app" />
        <meta property="og:image" content="/og-image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="QuestCraft - AI Powered Board Game Engine" />
        <meta
            name="twitter:description"
            content="Turn any topic into a playable AI-driven board game. Build quests, learn through play."
        />
        <meta name="twitter:image" content="/og-image.png" />
        <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Spline+Sans+Mono:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            // "The Game Table": felt chrome, printed paper components,
                            // brass as the single accent. Quest data (property bands,
                            // player tokens, resource bars) uses stock palette colors.
                            felt: {
                                900: '#0B241E',
                                800: '#103028',
                                700: '#164035',
                                600: '#1E5244',
                                500: '#2A6B59',
                            },
                            paper: {
                                DEFAULT: '#F3EEE2',
                                dim: '#E4DBC6',
                            },
                            ink: {
                                DEFAULT: '#22302B',
                                soft: '#5C6E64',
                            },
                            brass: {
                                DEFAULT: '#D9A13B',
                                bright: '#E8BA5F',
                                deep: '#A87818',
                            },
                            sage: '#9FB7A9',
                            clay: {
                                DEFAULT: '#C05540',
                                deep: '#A44330',
                            },
                        },
                        fontFamily: {
                            sans: ['"Atkinson Hyperlegible"', 'sans-serif'],
                            display: ['"Bricolage Grotesque"', 'sans-serif'],
                            mono: ['"Spline Sans Mono"', 'monospace'],
                        },
                        keyframes: {
                            'fade-in': {
                                '0%': { opacity: '0', transform: 'translateY(4px)' },
                                '100%': { opacity: '1', transform: 'translateY(0)' },
                            },
                            'dice-roll': {
                                '0%, 100%': { transform: 'rotate(0deg) scale(1)' },
                                '25%': { transform: 'rotate(15deg) scale(1.1)' },
                                '50%': { transform: 'rotate(-15deg) scale(1.1)' },
                                '75%': { transform: 'rotate(5deg) scale(1.1)' },
                            },
                            'token-move': {
                                '0%, 100%': { transform: 'translateY(0)' },
                                '50%': { transform: 'translateY(-10px)' },
                            },
                        },
                        animation: {
                            'fade-in': 'fade-in 0.4s ease-out',
                            'dice-roll': 'dice-roll 0.5s ease-in-out',
                            'token-move': 'token-move 0.3s ease-in-out',
                        },
                        typography: (theme) => ({
                            DEFAULT: {
                                css: {
                                    '--tw-prose-body': theme('colors.paper'),
                                    '--tw-prose-headings': theme('colors.brass.bright'),
                                    '--tw-prose-lead': theme('colors.sage'),
                                    '--tw-prose-links': theme('colors.brass.bright'),
                                    '--tw-prose-bold': theme('colors.paper'),
                                    '--tw-prose-counters': theme('colors.sage'),
                                    '--tw-prose-bullets': theme('colors.sage'),
                                    '--tw-prose-hr': theme('colors.felt.600'),
                                    '--tw-prose-quotes': theme('colors.paper'),
                                    '--tw-prose-quote-borders': theme('colors.felt.500'),
                                    '--tw-prose-captions': theme('colors.sage'),
                                    '--tw-prose-code': theme('colors.brass.bright'),
                                    '--tw-prose-pre-code': theme('colors.brass.bright'),
                                    '--tw-prose-pre-bg': theme('colors.felt.900'),
                                    '--tw-prose-th-borders': theme('colors.felt.600'),
                                    '--tw-prose-td-borders': theme('colors.felt.700'),
                                },
                            },
                        }),
                    },
                },
            };
        </script>
        <script type="importmap">
            {
                "imports": {
                    "react": "https://esm.sh/react@^19.1.1",
                    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
                    "react/": "https://esm.sh/react@^19.1.1/",
                    "@google/genai": "https://esm.sh/@google/genai@^1.13.0",
                    "showdown": "https://esm.sh/showdown@2.1.0",
                    "vite": "https://esm.sh/vite@^7.1.2",
                    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.0.0",
                    "vite-plugin-static-copy": "https://esm.sh/vite-plugin-static-copy@^3.1.1",
                    "path": "https://esm.sh/path@^0.12.7",
                    "fs": "https://esm.sh/fs@^0.0.1-security",
                    "ai": "https://esm.sh/ai@^5.0.15",
                    "openai": "https://esm.sh/openai@^5.12.2",
                    "openai/": "https://esm.sh/openai@^5.12.2/"
                }
            }
        </script>
    </head>
    <body class="bg-felt-900 text-paper font-sans antialiased">
        <style>
            /* The app shell is a fixed-height flex column; the window itself never scrolls. */
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            /* Visible keyboard focus everywhere, without changing mouse aesthetics. */
            :focus-visible {
                outline: 2px solid #d9a13b;
                outline-offset: 2px;
                border-radius: 4px;
            }
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                    scroll-behavior: auto !important;
                }
            }
        </style>
        <div id="root"></div>
        <script type="module" src="/index.tsx"></script>
    </body>
</html>
